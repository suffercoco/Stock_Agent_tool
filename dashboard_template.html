<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnover Notch Board</title>
<!--
  Template for build_dashboard.py. The __STOCH_DATA_JSON__ placeholder below is
  replaced with real rows from stoch_data.db; open the built dashboard.html,
  not this file.

  Language: the EN / 中文 switch in the filter row swaps every label. The choice
  is remembered in localStorage; a ?lang=zh or ?lang=en URL parameter overrides
  it (useful for a bookmarked NAS link).
-->
<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --cell-0: #efeee7;          /* below-notch heatmap cell */
    --l1: #86b6ef;              /* level 1 */
    --l2: #2a78d6;              /* level 2 */
    --l3: #104281;              /* level 3 */
    --inflow: #e34948;          /* net buy > 0 (red = inflow, A-share convention) */
    --outflow: #2a78d6;         /* net buy < 0 */
    --select-band: rgba(42, 120, 214, 0.08);
    --tooltip-bg: #232320;
    --tooltip-ink: #ffffff;
    --tooltip-ink-2: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --cell-0: #262624;
      --l1: #184f95;            /* dark mode: high magnitude gets the light step */
      --l2: #3987e5;
      --l3: #9ec5f4;
      --inflow: #e66767;
      --outflow: #3987e5;
      --select-band: rgba(57, 135, 229, 0.14);
      --tooltip-bg: #f0efec;
      --tooltip-ink: #0b0b0b;
      --tooltip-ink-2: #52514e;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 16px; }

  header h1 { font-size: 21px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-2); max-width: 68ch; }
  .meta-note { color: var(--muted); font-size: 12.5px; }

  .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-row label { color: var(--ink-2); font-size: 13px; }
  .filter-row select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  .filter-row select:focus-visible { outline: 2px solid var(--l2); outline-offset: 1px; }
  .filter-hint { color: var(--muted); font-size: 12.5px; }

  .lang-switch {
    margin-left: auto; display: inline-flex;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .lang-switch button {
    font: inherit; font-size: 12.5px; padding: 4px 10px; border: 0;
    background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .lang-switch button.active { background: var(--select-band); color: var(--ink); font-weight: 600; }
  .lang-switch button:focus-visible { outline: 2px solid var(--l2); outline-offset: -2px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .tile .lbl { color: var(--ink-2); font-size: 12.5px; }
  .tile .val { font-size: 26px; font-weight: 600; }
  .tile .sub { color: var(--muted); font-size: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .card .sub { color: var(--ink-2); font-size: 12.5px; margin: -6px 0 0; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend .dotsw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  svg text { font-family: inherit; }
  .axis-txt { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid-ln { stroke: var(--grid); stroke-width: 1; }
  .base-ln { stroke: var(--baseline); stroke-width: 1; }

  /* heatmap */
  .hm-scroll { overflow-x: auto; }
  .hm { display: grid; gap: 2px; font-variant-numeric: tabular-nums; min-width: 640px; }
  .hm .rowlbl {
    font-size: 11px; color: var(--ink-2); display: flex; align-items: center;
    padding-right: 8px; justify-content: flex-end;
  }
  .hm .collbl {
    font-size: 10.5px; color: var(--muted); text-align: center; padding-bottom: 2px;
    white-space: nowrap; cursor: pointer; border-radius: 4px;
  }
  .hm .collbl:hover { color: var(--ink); }
  .hm .collbl.sel { color: var(--ink); font-weight: 600; background: var(--select-band); }
  .hm .cell { height: 15px; border-radius: 2px; background: var(--cell-0); cursor: default; }
  .hm .cell.c1 { background: var(--l1); }
  .hm .cell.c2 { background: var(--l2); }
  .hm .cell.c3 { background: var(--l3); }
  .hm .cell.nodata { background: transparent; box-shadow: inset 0 0 0 1px var(--grid); }
  .hm .cell.hov { outline: 2px solid var(--ink); outline-offset: -1px; }
  .hm-more { color: var(--muted); font-size: 12px; }

  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .day-grid { grid-template-columns: 1fr; } }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 8px; border-bottom: 1px solid var(--grid); }
  th.num, td.num { text-align: right; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .neg { color: var(--outflow); }
  .pos { color: var(--inflow); }

  #tooltip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--tooltip-bg); color: var(--tooltip-ink);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); max-width: 260px;
    font-variant-numeric: tabular-nums;
  }
  #tooltip .t-title { font-weight: 600; }
  #tooltip .t-row { display: flex; align-items: baseline; gap: 8px; }
  #tooltip .t-row .k { color: var(--tooltip-ink-2); }
  #tooltip .t-row .v { font-weight: 600; margin-left: auto; }
  #tooltip .t-key { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 2px; }

  .bar-hit { fill: transparent; cursor: pointer; }
  .bar-hit:hover { fill: var(--select-band); }
  .sel-band { fill: var(--select-band); }
  @media (prefers-reduced-motion: no-preference) {
    .hm .cell, .bar-seg { transition: opacity 120ms ease; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="titleH"></h1>
    <p id="ledeP"></p>
    <p class="meta-note" id="metaLine"></p>
  </header>

  <div class="filter-row">
    <label for="daySel" id="dayLbl"></label>
    <select id="daySel"></select>
    <span class="filter-hint" id="filterHint"></span>
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h2 id="stackTitle"></h2>
    <p class="sub" id="stackSub"></p>
    <div class="legend" id="stackLegend"></div>
    <div id="stackChart"></div>
  </section>

  <section class="card">
    <h2 id="hmTitle"></h2>
    <p class="sub" id="hmSub"></p>
    <div class="legend" id="hmLegend"></div>
    <div class="hm-scroll"><div class="hm" id="heatmap"></div></div>
    <p class="hm-more" id="hmMore"></p>
  </section>

  <div class="day-grid">
    <section class="card">
      <h2 id="scatterTitle"></h2>
      <p class="sub" id="scatterSub"></p>
      <div class="legend" id="scatterLegend"></div>
      <div id="scatter"></div>
    </section>
    <section class="card">
      <h2 id="tableTitle"></h2>
      <p class="sub" id="tableSub"></p>
      <div style="overflow-x:auto">
        <table id="topTable">
          <thead>
            <tr><th id="thCode"></th><th id="thLevel"></th><th class="num" id="thRatio"></th><th class="num" id="thNb"></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div id="tooltip" role="status"></div>

<script>
"use strict";

/* ---------------- data injected by build_dashboard.py ---------------- */

const DATA = __STOCH_DATA_JSON__;

const stocks = DATA.stocks;
const days = DATA.days.map(s => {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
});
const ratio = DATA.ratio;        /* stocks × days; null = no reading */
const netBuy = DATA.net_buy;     /* same shape, 万; null = no reading */
const TH = DATA.thresholds;      /* ascending, e.g. [5, 10, 15] */

const levelOf = v =>
  v == null ? 0 : v >= TH[2] ? 3 : v >= TH[1] ? 2 : v >= TH[0] ? 1 : 0;
const LEVEL_VAR = ["--cell-0", "--l1", "--l2", "--l3"];

const fmtWan = v => {
  if (v == null) return "—";
  const sign = v < 0 ? "-" : "+";
  const a = Math.abs(v);
  return a >= 10000 ? sign + (a / 10000).toFixed(2) + " 亿" : sign + a.toLocaleString() + " 万";
};

/* ---------------- language ---------------- */

const I18N = {
  en: {
    htmlLang: "en",
    title: "Turnover notch board",
    lede: "End-of-day 占成交额比 (main-force net buy as % of turnover) across the watch list, bucketed by notch level.",
    meta: () => `Notch levels — L1 ≥ ${TH[0]}%, L2 ≥ ${TH[1]}%, L3 ≥ ${TH[2]}% · slot ${DATA.slot} · ` +
      `${stocks.length} stocks · ${days.length} trading days · built ${DATA.generated_at}`,
    dayLbl: "Trading day",
    filterHint: "or click any column / date header below — every panel follows the same day",
    kpiTracked: "Stocks tracked", kpiTrackedSub: "watch list size",
    kpiNotched: "Notched (L1+)", kpiNotchedSub: d => "on " + d,
    kpiL3: "At level 3", kpiL3Sub: () => `ratio ≥ ${TH[2]}%`,
    kpiTop: "Top ratio", kpiTopNone: "no readings this day",
    stackTitle: "How many stocks notched, day by day",
    stackSub: "Count of stocks at each level on the captured slot — the market-wide pulse of the notch system.",
    stackAria: "Stacked columns of notched stock counts per day",
    levelName: lv => ["below notch",
      `Level 1 · ${TH[0]}–${TH[1]}%`,
      `Level 2 · ${TH[1]}–${TH[2]}%`,
      `Level 3 · ≥${TH[2]}%`][lv],
    levelShort: lv => "Level " + lv,
    totalNotched: "Total notched",
    hmTitle: "Who is notching, and for how long",
    hmSub: "Stocks that reached level 1+ at least once in the window, one row each, sorted by notch days. Runs of dark cells are sustained main-force activity; isolated cells are one-day spikes. Hollow cells mean no reading that day.",
    hmNone: "No stock notched in this window.",
    hmCapped: (extra, cap) => `${extra} more stocks notched at least once; rows are capped at ${cap} by notch days — the table below keeps every value reachable.`,
    hmAll: (n, total) => `${n} of ${total} tracked stocks notched at least once in this window.`,
    noReading: "no reading",
    notch: "Notch",
    belowTh: () => `below ${TH[0]}%`,
    scatterTitle: "Selected day: ratio vs. net buy",
    scatterSub: d => `Every tracked stock on ${d}. Right of the zero line, the main force bought; height is the turnover share. Hairlines mark the notch thresholds.`,
    scatterAria: "Scatter of net buy versus turnover ratio for the selected day",
    inflow: "Net inflow", outflow: "Net outflow",
    tableTitle: d => "Top notched stocks · " + d,
    tableSub: "Table twin of the charts — the same values, readable without hovering.",
    thCode: "Code", thLevel: "Level", thRatio: "占成交额比", thNb: "主力净买额",
    tableEmpty: "No stock notched on this day.",
    dayShort: d => (d.getMonth() + 1) + "/" + d.getDate(),
  },
  zh: {
    htmlLang: "zh-CN",
    title: "占成交额比分级看板",
    lede: "收盘后自选股的占成交额比（主力净买额 ÷ 成交额），按档位分级呈现。",
    meta: () => `分级阈值 — 一档 ≥ ${TH[0]}%，二档 ≥ ${TH[1]}%，三档 ≥ ${TH[2]}% · 时段 ${DATA.slot} · ` +
      `${stocks.length} 只股票 · ${days.length} 个交易日 · 生成于 ${DATA.generated_at}`,
    dayLbl: "交易日",
    filterHint: "也可点击下方任意柱子或日期表头——所有面板联动到同一天",
    kpiTracked: "跟踪股票数", kpiTrackedSub: "自选列表规模",
    kpiNotched: "达档（L1+）", kpiNotchedSub: d => d,
    kpiL3: "达到三档", kpiL3Sub: () => `占比 ≥ ${TH[2]}%`,
    kpiTop: "最高占比", kpiTopNone: "当日无数据",
    stackTitle: "每日达档股票数",
    stackSub: "各交易日处于每个档位的股票数量——分级体系的整体脉搏。",
    stackAria: "每日达档股票数堆叠柱状图",
    levelName: lv => ["未达档",
      `一档 · ${TH[0]}–${TH[1]}%`,
      `二档 · ${TH[1]}–${TH[2]}%`,
      `三档 · ≥${TH[2]}%`][lv],
    levelShort: lv => ["", "一档", "二档", "三档"][lv],
    totalNotched: "达档合计",
    hmTitle: "哪些股票在达档、持续多久",
    hmSub: "统计窗口内至少达档一次的股票，每行一只，按达档天数排序。连续的深色格子表示主力持续活跃；孤立格子是单日脉冲；空心格子表示当日无数据。",
    hmNone: "窗口内没有股票达档。",
    hmCapped: (extra, cap) => `另有 ${extra} 只股票至少达档一次；按达档天数仅显示前 ${cap} 行——全部数值可在下方表格中查看。`,
    hmAll: (n, total) => `窗口内共有 ${n}/${total} 只跟踪股票至少达档一次。`,
    noReading: "无数据",
    notch: "档位",
    belowTh: () => `低于 ${TH[0]}%`,
    scatterTitle: "选定交易日：占比 vs. 净买额",
    scatterSub: d => `${d} 全部跟踪股票。零线右侧为主力净买入；纵轴为占成交额比；虚线为各档位阈值。`,
    scatterAria: "选定交易日净买额与占成交额比散点图",
    inflow: "净流入", outflow: "净流出",
    tableTitle: d => "达档股票排行 · " + d,
    tableSub: "与图表对应的数据表——同样的数值，无需悬停即可查看。",
    thCode: "代码", thLevel: "档位", thRatio: "占成交额比", thNb: "主力净买额",
    tableEmpty: "当日没有股票达档。",
    dayShort: d => (d.getMonth() + 1) + "月" + d.getDate() + "日",
  },
};

function loadLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl === "en" || fromUrl === "zh") return fromUrl;
  try {
    const saved = localStorage.getItem("notch-lang");
    if (saved === "en" || saved === "zh") return saved;
  } catch (e) { /* storage unavailable (e.g. file://) — fall through */ }
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
}
let lang = loadLang();
const t = () => I18N[lang];

const dayLabel = d => (d.getMonth() + 1) + "/" + d.getDate();   /* chart ticks: compact in both languages */
const dayFull = d => d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function setText(id, text) { document.getElementById(id).textContent = text; }

function applyLang() {
  document.documentElement.lang = t().htmlLang;
  document.title = t().title;
  setText("titleH", t().title);
  setText("ledeP", t().lede);
  setText("metaLine", t().meta());
  setText("dayLbl", t().dayLbl);
  setText("filterHint", t().filterHint);
  setText("stackTitle", t().stackTitle);
  setText("stackSub", t().stackSub);
  setText("hmTitle", t().hmTitle);
  setText("hmSub", t().hmSub);
  setText("tableSub", t().tableSub);
  setText("thCode", t().thCode);
  setText("thLevel", t().thLevel);
  setText("thRatio", t().thRatio);
  setText("thNb", t().thNb);
  document.querySelectorAll("#langSwitch button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
}

document.querySelectorAll("#langSwitch button").forEach(b =>
  b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("notch-lang", lang); } catch (e) { /* ignore */ }
    applyLang();
    setDay(selDay);        /* re-render every panel in the new language */
  }));

/* ---------------- shared state + tooltip ---------------- */

let selDay = days.length - 1;    /* open on the latest capture */
const tooltip = document.getElementById("tooltip");

function showTooltip(x, y, build) {
  tooltip.replaceChildren();
  build(tooltip);
  tooltip.style.display = "block";
  const r = tooltip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
  tooltip.style.left = Math.max(4, left) + "px";
  tooltip.style.top = Math.max(4, top) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

function tRow(el, key, val, swColor) {
  const row = document.createElement("div");
  row.className = "t-row";
  if (swColor) {
    const sw = document.createElement("span");
    sw.className = "t-key"; sw.style.background = swColor;
    row.appendChild(sw);
  }
  const k = document.createElement("span"); k.className = "k"; k.textContent = key;
  const v = document.createElement("span"); v.className = "v"; v.textContent = val;
  row.append(k, v); el.appendChild(row);
}
function tTitle(el, text) {
  const title = document.createElement("div");
  title.className = "t-title"; title.textContent = text;
  el.appendChild(title);
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------------- KPI tiles ---------------- */

function renderKpis() {
  const counts = [0, 0, 0, 0];
  let topV = null, topS = -1;
  for (let s = 0; s < stocks.length; s++) {
    const v = ratio[s][selDay];
    if (v == null) continue;
    counts[levelOf(v)]++;
    if (topV == null || v > topV) { topV = v; topS = s; }
  }
  const notched = counts[1] + counts[2] + counts[3];
  const el = document.getElementById("kpis");
  el.replaceChildren();
  const tiles = [
    [t().kpiTracked, String(stocks.length), t().kpiTrackedSub],
    [t().kpiNotched, String(notched), t().kpiNotchedSub(t().dayShort(days[selDay]))],
    [t().kpiL3, String(counts[3]), t().kpiL3Sub()],
    topV == null
      ? [t().kpiTop, "—", t().kpiTopNone]
      : [t().kpiTop, topV.toFixed(2) + "%", stocks[topS] + " · " + fmtWan(netBuy[topS][selDay])],
  ];
  for (const [lbl, val, sub] of tiles) {
    const tile = document.createElement("div"); tile.className = "tile";
    const l = document.createElement("div"); l.className = "lbl"; l.textContent = lbl;
    const v = document.createElement("div"); v.className = "val"; v.textContent = val;
    const s = document.createElement("div"); s.className = "sub"; s.textContent = sub;
    tile.append(l, v, s); el.appendChild(tile);
  }
}

/* ---------------- stacked columns: notch counts per day ---------------- */

const SNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

const dayCounts = days.map((_, d) => {
  const c = [0, 0, 0, 0];
  for (let s = 0; s < stocks.length; s++) {
    const v = ratio[s][d];
    if (v == null) continue;
    c[levelOf(v)]++;
  }
  return c;
});

function renderStack() {
  const W = 980, H = 230, mL = 34, mR = 6, mT = 10, mB = 24;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const maxN = Math.max(1, ...dayCounts.map(c => c[1] + c[2] + c[3]));
  const yMax = Math.max(4, Math.ceil(maxN / 4) * 4);
  const band = plotW / days.length;
  const barW = Math.min(24, band * 0.62);
  const y = v => mT + plotH - (v / yMax) * plotH;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img",
    "aria-label": t().stackAria });

  for (let tick = 0; tick <= yMax; tick += yMax / 4) {
    svg.appendChild(svgEl("line", { x1: mL, x2: W - mR, y1: y(tick), y2: y(tick), class: tick === 0 ? "base-ln" : "grid-ln" }));
    const txt = svgEl("text", { x: mL - 6, y: y(tick) + 3.5, "text-anchor": "end", class: "axis-txt" });
    txt.textContent = String(tick);
    svg.appendChild(txt);
  }

  const selBand = svgEl("rect", { class: "sel-band", x: mL + selDay * band + 1, y: mT, width: band - 2, height: plotH, rx: 4 });
  svg.appendChild(selBand);

  for (let d = 0; d < days.length; d++) {
    const cx = mL + d * band + band / 2;
    let acc = 0;
    const c = dayCounts[d];
    for (let lv = 1; lv <= 3; lv++) {
      if (!c[lv]) continue;
      const y1 = y(acc + c[lv]), y0 = y(acc);
      const isTop = (lv === 3) || (lv === 2 && !c[3]) || (lv === 1 && !c[2] && !c[3]);
      const h = Math.max(1, y0 - y1 - (acc > 0 ? 2 : 0));  /* 2px surface gap between segments */
      const seg = svgEl("rect", {
        class: "bar-seg", x: cx - barW / 2, y: y1, width: barW, height: h,
        fill: `var(${LEVEL_VAR[lv]})`, rx: isTop ? 4 : 0,
      });
      svg.appendChild(seg);
      /* square the rounded rect at its bottom edge */
      if (isTop && h > 4) {
        svg.appendChild(svgEl("rect", { x: cx - barW / 2, y: y1 + h - 4, width: barW, height: 4, fill: `var(${LEVEL_VAR[lv]})` }));
      }
      acc += c[lv];
    }
    if (d % 5 === 0 || d === days.length - 1) {
      const txt = svgEl("text", { x: cx, y: H - 8, "text-anchor": "middle", class: "axis-txt" });
      txt.textContent = dayLabel(days[d]);
      svg.appendChild(txt);
    }
    const hit = svgEl("rect", { class: "bar-hit", x: mL + d * band, y: mT, width: band, height: plotH, rx: 4, tabindex: "0",
      "aria-label": dayFull(days[d]) + ": " + (c[1] + c[2] + c[3]) });
    hit.addEventListener("pointermove", ev => {
      showTooltip(ev.clientX, ev.clientY, el => {
        tTitle(el, dayFull(days[d]));
        tRow(el, t().levelShort(3), String(c[3]), cssVar("--l3"));
        tRow(el, t().levelShort(2), String(c[2]), cssVar("--l2"));
        tRow(el, t().levelShort(1), String(c[1]), cssVar("--l1"));
        tRow(el, t().totalNotched, String(c[1] + c[2] + c[3]));
      });
    });
    hit.addEventListener("pointerleave", hideTooltip);
    hit.addEventListener("click", () => setDay(d));
    hit.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setDay(d); } });
    svg.appendChild(hit);
  }

  const box = document.getElementById("stackChart");
  box.replaceChildren(svg);

  const leg = document.getElementById("stackLegend");
  leg.replaceChildren();
  for (let lv = 3; lv >= 1; lv--) {
    const k = document.createElement("span"); k.className = "key";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = `var(${LEVEL_VAR[lv]})`;
    const label = document.createElement("span"); label.textContent = t().levelName(lv);
    k.append(sw, label); leg.appendChild(k);
  }
}

/* ---------------- heatmap: notched stocks × days ---------------- */

const notchedRows = stocks
  .map((code, s) => {
    let notchDays = 0, maxR = 0;
    for (let d = 0; d < days.length; d++) {
      const v = ratio[s][d];
      if (v == null) continue;
      if (v >= TH[0]) notchDays++;
      if (v > maxR) maxR = v;
    }
    return { s, code, notchDays, maxR };
  })
  .filter(r => r.notchDays > 0)
  .sort((a, b) => b.notchDays - a.notchDays || b.maxR - a.maxR);

const HM_MAX_ROWS = 40;

function renderHeatmap() {
  const hm = document.getElementById("heatmap");
  hm.replaceChildren();
  hm.style.gridTemplateColumns = `64px repeat(${days.length}, minmax(16px, 1fr))`;

  const corner = document.createElement("div");
  hm.appendChild(corner);
  for (let d = 0; d < days.length; d++) {
    const h = document.createElement("div");
    h.className = "collbl" + (d === selDay ? " sel" : "");
    h.textContent = (d % 5 === 0 || d === days.length - 1 || d === selDay) ? dayLabel(days[d]) : "·";
    h.title = dayFull(days[d]);
    h.addEventListener("click", () => setDay(d));
    hm.appendChild(h);
  }

  const shown = notchedRows.slice(0, HM_MAX_ROWS);
  for (const row of shown) {
    const lbl = document.createElement("div");
    lbl.className = "rowlbl"; lbl.textContent = row.code;
    hm.appendChild(lbl);
    for (let d = 0; d < days.length; d++) {
      const v = ratio[row.s][d];
      const lv = levelOf(v);
      const cell = document.createElement("div");
      cell.className = "cell" + (v == null ? " nodata" : lv ? " c" + lv : "");
      cell.tabIndex = 0;
      cell.setAttribute("aria-label", row.code + " " + dayFull(days[d]) + ": " +
        (v == null ? t().noReading : v.toFixed(2) + "%"));
      const show = (x, yy) => showTooltip(x, yy, el => {
        tTitle(el, row.code + " · " + dayFull(days[d]));
        if (v == null) {
          tRow(el, "占成交额比", t().noReading);
        } else {
          tRow(el, "占成交额比", v.toFixed(2) + "%", lv ? cssVar(LEVEL_VAR[lv]) : null);
          tRow(el, "主力净买额", fmtWan(netBuy[row.s][d]));
          tRow(el, t().notch, lv ? t().levelShort(lv) : t().belowTh());
        }
      });
      cell.addEventListener("pointermove", ev => { cell.classList.add("hov"); show(ev.clientX, ev.clientY); });
      cell.addEventListener("pointerleave", () => { cell.classList.remove("hov"); hideTooltip(); });
      cell.addEventListener("focus", () => { const r = cell.getBoundingClientRect(); show(r.right, r.bottom); });
      cell.addEventListener("blur", hideTooltip);
      hm.appendChild(cell);
    }
  }

  const more = document.getElementById("hmMore");
  if (!notchedRows.length) {
    more.textContent = t().hmNone;
  } else if (notchedRows.length > HM_MAX_ROWS) {
    more.textContent = t().hmCapped(notchedRows.length - HM_MAX_ROWS, HM_MAX_ROWS);
  } else {
    more.textContent = t().hmAll(notchedRows.length, stocks.length);
  }

  const leg = document.getElementById("hmLegend");
  leg.replaceChildren();
  for (let lv = 0; lv <= 3; lv++) {
    const k = document.createElement("span"); k.className = "key";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = `var(${LEVEL_VAR[lv]})`;
    if (lv === 0) sw.style.border = "1px solid " + cssVar("--grid");
    const label = document.createElement("span");
    label.textContent = lv === 0 ? `< ${TH[0]}%` : t().levelName(lv);
    k.append(sw, label); leg.appendChild(k);
  }
}

/* ---------------- scatter: selected day, net buy vs ratio ---------------- */

function renderScatter() {
  const W = 520, H = 340, mL = 36, mR = 14, mT = 12, mB = 30;
  const plotW = W - mL - mR, plotH = H - mT - mB;

  const pts = [];
  for (let s = 0; s < stocks.length; s++) {
    const r = ratio[s][selDay], nb = netBuy[s][selDay];
    if (r == null || nb == null) continue;
    pts.push({ code: stocks[s], x: nb, y: r });
  }
  const maxAbs = Math.max(1, ...pts.map(p => Math.abs(p.x))) * 1.08;
  const maxY = Math.max(TH[2] + 2, ...pts.map(p => p.y * 1.1));
  const X = v => mL + ((v + maxAbs) / (2 * maxAbs)) * plotW;
  const Y = v => mT + plotH - (v / maxY) * plotH;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img",
    "aria-label": t().scatterAria });

  const yTick = maxY > 30 ? 10 : 5;
  for (let tick = 0; tick <= maxY; tick += yTick) {
    svg.appendChild(svgEl("line", { x1: mL, x2: W - mR, y1: Y(tick), y2: Y(tick), class: tick === 0 ? "base-ln" : "grid-ln" }));
    const txt = svgEl("text", { x: mL - 5, y: Y(tick) + 3.5, "text-anchor": "end", class: "axis-txt" });
    txt.textContent = tick + "%";
    svg.appendChild(txt);
  }
  /* notch thresholds — dashed because they ARE thresholds, not grid */
  for (const [lv, th] of [[1, TH[0]], [2, TH[1]], [3, TH[2]]]) {
    if (th > maxY) continue;
    svg.appendChild(svgEl("line", { x1: mL, x2: W - mR, y1: Y(th), y2: Y(th),
      stroke: `var(${LEVEL_VAR[lv]})`, "stroke-width": 1, "stroke-dasharray": "3 4", opacity: 0.7 }));
    const txt = svgEl("text", { x: W - mR, y: Y(th) - 3, "text-anchor": "end", class: "axis-txt" });
    txt.textContent = "L" + lv;
    svg.appendChild(txt);
  }
  svg.appendChild(svgEl("line", { x1: X(0), x2: X(0), y1: mT, y2: mT + plotH, class: "base-ln" }));
  for (const v of [-maxAbs * 0.75, 0, maxAbs * 0.75]) {
    const txt = svgEl("text", { x: X(v), y: H - 10, "text-anchor": "middle", class: "axis-txt" });
    txt.textContent = v === 0 ? "0" : (v > 0 ? "+" : "-") + (Math.abs(v) >= 10000 ? (Math.abs(v) / 10000).toFixed(1) + "亿" : Math.round(Math.abs(v)) + "万");
    svg.appendChild(txt);
  }
  const xcap = svgEl("text", { x: mL + plotW / 2, y: H - 10, "text-anchor": "middle", class: "axis-txt" });
  xcap.textContent = "主力净买额 →";
  svg.appendChild(xcap);

  for (const p of pts) {
    svg.appendChild(svgEl("circle", { cx: X(p.x), cy: Y(p.y), r: 5,
      fill: p.x >= 0 ? "var(--inflow)" : "var(--outflow)",
      stroke: "var(--surface)", "stroke-width": 2 }));
  }
  /* direct-label the top 3 by ratio, skipping labels that would collide */
  const top3 = [...pts].sort((a, b) => b.y - a.y).slice(0, 3);
  const placed = [];
  for (const p of top3) {
    const lx = X(p.x), ly = Y(p.y);
    if (placed.some(q => Math.abs(q[0] - lx) < 64 && Math.abs(q[1] - ly) < 14)) continue;
    placed.push([lx, ly]);
    const anchor = lx > W - 90 ? "end" : "start";
    const txt = svgEl("text", { x: lx + (anchor === "start" ? 8 : -8), y: ly + 4,
      "text-anchor": anchor, class: "axis-txt", fill: "var(--ink-2)" });
    txt.textContent = p.code;
    svg.appendChild(txt);
  }

  /* nearest-point hover layer */
  const hover = svgEl("rect", { x: mL, y: mT, width: plotW, height: plotH, fill: "transparent" });
  let ring = null;
  hover.addEventListener("pointermove", ev => {
    if (!pts.length) return;
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const py = (ev.clientY - r.top) * (H / r.height);
    let best = null, bd = Infinity;
    for (const p of pts) {
      const dx = X(p.x) - px, dy = Y(p.y) - py, dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = p; }
    }
    if (!best) return;
    if (ring) ring.remove();
    ring = svgEl("circle", { cx: X(best.x), cy: Y(best.y), r: 8, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5 });
    svg.insertBefore(ring, hover);
    showTooltip(ev.clientX, ev.clientY, el => {
      tTitle(el, best.code);
      tRow(el, "占成交额比", best.y.toFixed(2) + "%");
      tRow(el, "主力净买额", fmtWan(best.x), best.x >= 0 ? cssVar("--inflow") : cssVar("--outflow"));
      const lv = levelOf(best.y);
      tRow(el, t().notch, lv ? t().levelShort(lv) : t().belowTh());
    });
  });
  hover.addEventListener("pointerleave", () => { if (ring) { ring.remove(); ring = null; } hideTooltip(); });
  svg.appendChild(hover);

  document.getElementById("scatter").replaceChildren(svg);
  setText("scatterTitle", t().scatterTitle);
  setText("scatterSub", t().scatterSub(dayFull(days[selDay])));

  const leg = document.getElementById("scatterLegend");
  leg.replaceChildren();
  for (const [name, v] of [[t().inflow, "--inflow"], [t().outflow, "--outflow"]]) {
    const k = document.createElement("span"); k.className = "key";
    const sw = document.createElement("span"); sw.className = "dotsw"; sw.style.background = `var(${v})`;
    const label = document.createElement("span"); label.textContent = name;
    k.append(sw, label); leg.appendChild(k);
  }
}

/* ---------------- table: top notched stocks on selected day ---------------- */

function renderTable() {
  const rows = stocks
    .map((code, s) => ({ code, r: ratio[s][selDay], nb: netBuy[s][selDay] }))
    .filter(x => x.r != null && x.r >= TH[0])
    .sort((a, b) => b.r - a.r)
    .slice(0, 14);
  const tbody = document.querySelector("#topTable tbody");
  tbody.replaceChildren();
  for (const x of rows) {
    const tr = document.createElement("tr");
    const tdC = document.createElement("td"); tdC.textContent = x.code;
    const tdL = document.createElement("td");
    const lv = levelOf(x.r);
    const chip = document.createElement("span"); chip.className = "chip";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = `var(${LEVEL_VAR[lv]})`;
    const ct = document.createElement("span"); ct.textContent = "L" + lv;
    chip.append(sw, ct); tdL.appendChild(chip);
    const tdR = document.createElement("td"); tdR.className = "num"; tdR.textContent = x.r.toFixed(2) + "%";
    const tdN = document.createElement("td");
    tdN.className = "num " + (x.nb != null && x.nb >= 0 ? "pos" : "neg");
    tdN.textContent = fmtWan(x.nb);
    tr.append(tdC, tdL, tdR, tdN);
    tbody.appendChild(tr);
  }
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4; td.textContent = t().tableEmpty;
    td.style.color = "var(--muted)";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  setText("tableTitle", t().tableTitle(dayFull(days[selDay])));
}

/* ---------------- day selection wiring ---------------- */

const daySel = document.getElementById("daySel");
days.forEach((d, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = dayFull(d);
  daySel.appendChild(o);
});
daySel.value = String(selDay);
daySel.addEventListener("change", () => setDay(+daySel.value));

function setDay(d) {
  selDay = d;
  daySel.value = String(d);
  hideTooltip();
  renderKpis(); renderStack(); renderHeatmap(); renderScatter(); renderTable();
}

applyLang();
setDay(selDay);
</script>
